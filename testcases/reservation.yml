- id: TC-RSV-001
  type: manual
  category: 予約
  level: integration
  tags: [回帰, 正常系]
  priority: high
  title: 会議室を予約できる
  steps:
    - トップ画面を開く
    - 「予約する」の会議室・件名・開始・終了・参加人数を入力する
    - 予約ボタンを押す
  expected: 予約一覧に追加され、「予約しました。」と緑色で表示される

- id: TC-RSV-002
  type: manual
  category: 予約
  level: integration
  tags: [回帰, 正常系]
