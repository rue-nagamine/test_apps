<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会議室予約</title>
<style>
  :root { --line:#dcdfe4; --ink:#1f2328; --muted:#636c76; --bad:#c8232c; --ok:#1a7f37; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 64px; font:14px/1.7 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
         color:var(--ink); background:#f6f7f9; }
  main { max-width:880px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 20px; }
  h2 { font-size:15px; margin:0 0 12px; }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  form { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  input, select { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; min-width:0; }
  button { padding:7px 14px; border:0; border-radius:6px; background:var(--ink); color:#fff; font:inherit; cursor:pointer; }
  button.link { background:none; color:var(--bad); padding:2px 4px; text-decoration:underline; }
  table { width:100%; border-collapse:collapse; margin-top:12px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  .msg { margin-top:12px; font-size:13px; min-height:1.7em; }
  .msg.error { color:var(--bad); }
  .msg.success { color:var(--ok); }
  .empty { color:var(--muted); padding:12px 0; }
</style>
</head>
<body>
<main>
  <h1>会議室予約</h1>

  <section>
    <h2>会議室を登録する</h2>
    <form id="room-form">
      <label>名前<input name="name" required placeholder="第1会議室"></label>
      <label>定員<input name="capacity" type="number" min="1" value="6" required style="width:80px"></label>
      <button type="submit">登録</button>
    </form>
    <p class="msg" id="room-msg"></p>
    <table id="room-table">
      <thead><tr><th>会議室</th><th>定員</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>予約する</h2>
    <form id="reservation-form">
      <label>会議室<select name="room_id" id="room-select" required></select></label>
      <label>件名<input name="title" required placeholder="定例会"></label>
      <label>開始<input name="start" type="datetime-local" required></label>
      <label>終了<input name="end" type="datetime-local" required></label>
      <label>参加人数<input name="attendees" type="number" min="1" value="4" required style="width:80px"></label>
      <button type="submit">予約</button>
    </form>
    <p class="msg" id="reservation-msg"></p>
  </section>

  <section>
    <h2>予約一覧</h2>
    <table id="reservation-table">
      <thead><tr><th>日時</th><th>会議室</th><th>件名</th><th>人数</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="empty" id="reservation-empty" hidden>予約はまだありません。</p>
  </section>
</main>

<script>
const rooms = new Map();

function say(id, text, kind) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "msg" + (kind ? " " + kind : "");
}

async function call(url, options) {
  const res = await fetch(url, options);
  if (res.status === 204) return null;
  const body = await res.json();
  if (!res.ok) throw new Error(body.detail || "処理に失敗しました");
  return body;
}

function formatSpan(start, end) {
  const s = new Date(start), e = new Date(end);
  const d = `${s.getMonth() + 1}/${s.getDate()}`;
  const t = (x) => String(x.getHours()).padStart(2, "0") + ":" + String(x.getMinutes()).padStart(2, "0");
  return `${d} ${t(s)}〜${t(e)}`;
}

async function loadRooms() {
  const list = await call("/api/rooms");
  rooms.clear();
  list.forEach((r) => rooms.set(r.id, r));

  document.querySelector("#room-table tbody").innerHTML = list
    .map((r) => `<tr><td>${r.name}</td><td>${r.capacity} 名</td></tr>`)
    .join("") || `<tr><td colspan="2" class="empty">会議室はまだありません。</td></tr>`;

  const select = document.getElementById("room-select");
  const keep = select.value;
  select.innerHTML = list.map((r) => `<option value="${r.id}">${r.name}（定員 ${r.capacity} 名）</option>`).join("");
  if (keep) select.value = keep;
}

async function loadReservations() {
  const list = await call("/api/reservations");
  document.getElementById("reservation-empty").hidden = list.length > 0;
  document.querySelector("#reservation-table tbody").innerHTML = list
    .map((r) => {
      const room = rooms.get(r.room_id);
      return `<tr>
        <td>${formatSpan(r.start, r.end)}</td>
        <td>${room ? room.name : "-"}</td>
        <td>${r.title}</td>
        <td>${r.attendees} 名</td>
        <td><button class="link" data-cancel="${r.id}">キャンセル</button></td>
      </tr>`;
    })
    .join("");
}

document.getElementById("room-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  try {
    await call("/api/rooms", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: form.get("name"), capacity: Number(form.get("capacity")) }),
    });
    say("room-msg", "会議室を登録しました。", "success");
    e.target.reset();
    await loadRooms();
  } catch (err) {
    say("room-msg", err.message, "error");
  }
});

document.getElementById("reservation-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  try {
    await call("/api/reservations", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        room_id: Number(form.get("room_id")),
        title: form.get("title"),
        start: form.get("start"),
        end: form.get("end"),
        attendees: Number(form.get("attendees")),
      }),
    });
    say("reservation-msg", "予約しました。", "success");
    await loadReservations();
  } catch (err) {
    say("reservation-msg", err.message, "error");
  }
});

document.querySelector("#reservation-table tbody").addEventListener("click", async (e) => {
  const id = e.target.dataset.cancel;
  if (!id) return;
  try {
    await call(`/api/reservations/${id}`, { method: "DELETE" });
    say("reservation-msg", "予約をキャンセルしました。", "success");
    await loadReservations();
  } catch (err) {
    say("reservation-msg", err.message, "error");
  }
});

(async () => {
  await loadRooms();
  await loadReservations();
})();
</script>
</body>
</html>
